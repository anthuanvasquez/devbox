name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  syntax-check:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bash syntax (shellcheck -n equivalent)
        run: |
          bash -n install.sh
          bash -n update-orca.sh

      - name: Verify shebang and executable bit
        run: |
          head -n1 install.sh | grep -q '^#!/usr/bin/env bash'
          test -x install.sh
          head -n1 update-orca.sh | grep -q '^#!/usr/bin/env bash'
          test -x update-orca.sh
